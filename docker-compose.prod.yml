version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        user: www-data
        uid: 33
    image: awbtracker-prod
    container_name: awbtracker_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - awb-network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: awbtracker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker-compose/mysql:/docker-entrypoint-initdb.d
    networks:
      - awb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: awbtracker_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - awb-network

  nginx:
    image: nginx:alpine
    container_name: awbtracker_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
      - ./docker-compose/nginx/logs:/var/log/nginx
    networks:
      - awb-network
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        user: www-data
        uid: 33
    image: awbtracker-prod
    container_name: awbtracker_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - awb-network
    depends_on:
      - db
      - redis

  queue:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        user: www-data
        uid: 33
    image: awbtracker-prod
    container_name: awbtracker_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - awb-network
    depends_on:
      - db
      - redis

networks:
  awb-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
